services:
  # pgvector is just the postgres image with the extension baked in - same container either way.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: coderag
      POSTGRES_USER: coderag
      POSTGRES_PASSWORD: coderag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot: pulls the embedding model into the ollama service above, then exits. The MCP
  # server itself is not a compose service - it's launched on demand by whatever MCP client
  # (Claude Code, Claude Desktop) is using it, over stdio, pointed at these two services.
  ollama-pull-embedding-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"

volumes:
  postgres-data:
  ollama-data:
